name: add-ssh-key

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Nouvelle clé publique (ssh-ed25519 AAAA...)"
        required: true

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      # 1. Garde-fou : on n'accepte qu'une vraie clé publique
      - name: Valider la clé publique
        env:
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          case "$PUBKEY" in
            ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-*) ;;
            *) echo "Ce n'est pas une clé publique valide."; exit 1 ;;
          esac

      # 2. Même action que ton déploiement, mais avec une autre commande
      - name: Ajouter la clé sur le VPS
        uses: appleboy/ssh-action@v1
        env:
          PUBKEY: ${{ inputs.pubkey }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PUBKEY
          script: |
            set -e
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "$PUBKEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "Clé ajoutée."
