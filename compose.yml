services:
  backend:
    build: ./backend
    image: youssefess/cinebook-backend:latest
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    volumes:
      - cinebook_db:/var/lib/postgresql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebook_user -d cinebook_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.10-alpine
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  nginx:
    build:
      context: . 
      dockerfile: frontend/Dockerfile.prod
    image: youssefess/cinebook-nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
volumes:
  cinebook_db:

